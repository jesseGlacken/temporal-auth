# Override for temporal-auth RBAC/OIDC server.
#
# Replaces the stock temporalio/server image with the custom auth server and
# injects OIDC auth variables into the Temporal UI. All other services
# (postgresql, opensearch, temporal-admin-tools, temporal-create-namespace)
# come from the base compose unchanged.
#
# Usage (Dokploy or CLI):
#   docker compose \
#     -f /path/to/temporal-server-operations/compose/docker-compose-postgres-opensearch.yml \
#     -f docker-compose.yml \
#     up --build
#
# Prerequisites:
#   - Copy .env.template to .env and fill in OIDC credentials.
#   - The embedded go.temporal.io/server version in server/go.mod must match
#     TEMPORAL_ADMINTOOLS_VERSION in the base compose .env, or the server will
#     reject the schema created by admin-tools. Update go.mod if needed.

services:
  temporal:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: temporal-auth-server:latest
    env_file:
      - .env
    environment:
      TEMPORAL_OIDC_ISSUER_URL: ${TEMPORAL_OIDC_ISSUER_URL}
      TEMPORAL_OIDC_CLIENT_ID: ${TEMPORAL_OIDC_CLIENT_ID}
    volumes:
      - ./docker/temporal-config.yaml:/app/config/development.yaml

